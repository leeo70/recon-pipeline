[package]
name = "js-secrets"
version = "0.1.0"
edition = "2021"
description = "Motor CPU-bound de scan de secrets/endpoints em JS para pipeline de recon"

[[bin]]
name = "js-secrets"
path = "src/main.rs"

[dependencies]
regex = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
